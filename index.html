<!-- 日本の都道府県シルエットクイズ -->
<!-- フォント・アイコン・ライブラリの読み込み -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<style>
/* --------------------------------------
   スタイリッシュ＆レスポンシブ UI
-------------------------------------- */
:root {
  /* カラーパレットと変数の定義 */
  --surface: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --border-light: #e2e8f0;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-bg: #eff6ff;
  --success: #10b981;
  --success-bg: #d1fae5;
  --danger: #ef4444;
  --danger-bg: #fee2e2;
  --radius-lg: 20px;
  --radius-md: 12px;
}

body {
  margin: 0;
  padding: 0;
  background-color: #f8fafc;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
}

#pq-wrapper {
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text-main);
  background: var(--surface);
  /* レスポンシブ対応の幅指定 */
  width: 92%;
  max-width: 480px;
  margin: 24px auto;
  border-radius: var(--radius-lg);
  box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
  padding: 24px;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
}

/* タイトルデザイン */
.pq-title {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 20px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-main);
}
.pq-title i {
  color: var(--primary);
  font-size: 24px;
}

/* ローディングスピナー */
.pq-loading-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 250px;
  color: var(--text-muted);
}
.pq-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--border-light);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: pq-spin-fast 1s linear infinite;
  margin-bottom: 16px;
}
@keyframes pq-spin-fast {
  to { transform: rotate(360deg); }
}

/* ヘッダー・プログレスバー */
.pq-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.pq-badge {
  background: var(--primary-bg);
  color: var(--primary);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.pq-progress-track {
  height: 6px;
  background: var(--border-light);
  border-radius: 999px;
  margin-bottom: 24px;
  overflow: hidden;
}
.pq-progress-bar {
  height: 100%;
  width: 0%;
  background: var(--primary);
  border-radius: 999px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ステージ (SVG描画エリア) */
.pq-stage {
  background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 240px;
  margin-bottom: 24px;
  position: relative;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
}
.pq-svg {
  max-width: 100%;
  max-height: 100%;
  filter: drop-shadow(0 4px 8px rgba(59, 130, 246, 0.35)); /* シルエットの影 */
}
.pq-svg path {
  fill: var(--primary);
  stroke: #ffffff;
  stroke-width: 0.5px;
  stroke-linejoin: round;
}

@keyframes pq-spin-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.pq-spin-anim {
  animation: pq-spin-slow 16s linear infinite;
}

@keyframes pq-pop {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* 選択肢ボタン */
.pq-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.pq-opt {
  background: var(--surface);
  border: 2px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  /* 長い名前の折り返しを防ぐ */
  white-space: nowrap;
}
.pq-opt:hover:not(:disabled) {
  border-color: var(--primary);
  background: var(--primary-bg);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
}
.pq-opt:active:not(:disabled) {
  transform: translateY(1px);
}
.pq-opt:disabled {
  cursor: default;
  opacity: 0.7;
}
.pq-opt.pq-correct {
  border-color: var(--success);
  background: var(--success-bg);
  color: var(--success);
  opacity: 1;
}
.pq-opt.pq-wrong {
  border-color: var(--danger);
  background: var(--danger-bg);
  color: var(--danger);
}

/* フィードバックとアクションボタン */
.pq-feedback-area {
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}
.pq-feedback-text {
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  animation: pq-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
.pq-btn-primary {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 12px 28px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
  font-family: inherit;
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
}
.pq-btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(59, 130, 246, 0.4);
}

/* 終了画面 */
.pq-end-screen {
  text-align: center;
  padding: 16px 0;
  animation: pq-pop 0.4s ease forwards;
}
.pq-trophy {
  width: 80px;
  height: 80px;
  background: var(--primary-bg);
  color: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}
.pq-trophy i {
  font-size: 40px;
}
.pq-score-large {
  font-size: 32px;
  font-weight: 700;
  color: var(--text-main);
  margin: 0 0 8px;
}
.pq-end-msg {
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 500;
  margin: 0 0 32px;
}

/* --------------------------------------
   スマホ向けレスポンシブ調整 (480px以下)
-------------------------------------- */
@media (max-width: 480px) {
  #pq-wrapper {
    margin: 16px auto;
    padding: 20px 16px;
    border-radius: 16px;
  }
  .pq-title {
    font-size: 18px;
    margin-bottom: 16px;
  }
  .pq-title i {
    font-size: 20px;
  }
  .pq-stage {
    height: 200px;
    margin-bottom: 20px;
  }
  .pq-options {
    gap: 8px;
    margin-bottom: 16px;
  }
  .pq-opt {
    padding: 12px 8px;
    font-size: 14px;
  }
  .pq-badge {
    padding: 5px 12px;
    font-size: 12px;
  }
}
</style>

<div id="pq-wrapper">
  <!-- タイトル -->
  <h1 class="pq-title"><i class="ti ti-map-search"></i>都道府県シルエットクイズ</h1>

  <!-- 読み込み中画面 -->
  <div id="pq-loading" class="pq-loading-container">
    <div class="pq-spinner"></div>
    <div style="font-size: 14px; font-weight: 700;">地図データを読み込み中...</div>
  </div>

  <!-- クイズ本体 -->
  <div id="pq-app" style="display: none;">
    <div class="pq-header">
      <span id="pq-progress" class="pq-badge"></span>
      <span id="pq-score" class="pq-badge"></span>
    </div>
    <div class="pq-progress-track">
      <div id="pq-bar" class="pq-progress-bar"></div>
    </div>
    
    <div class="pq-stage">
      <svg id="pq-svg" class="pq-svg pq-spin-anim" viewBox="0 0 100 100" width="200" height="200">
        <path id="pq-path" d=""></path>
      </svg>
    </div>
    
    <div id="pq-options" class="pq-options"></div>
    
    <div class="pq-feedback-area">
      <div id="pq-feedback"></div>
      <button id="pq-next" class="pq-btn-primary" style="display:none; margin-top: 14px;">
        次の問題へ <i class="ti ti-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!-- 終了画面 -->
  <div id="pq-end" class="pq-end-screen" style="display: none;">
    <div class="pq-trophy"><i class="ti ti-trophy" aria-hidden="true"></i></div>
    <h3 class="pq-score-large" id="pq-final-score"></h3>
    <p class="pq-end-msg">お疲れさまでした！</p>
    <button id="pq-restart" class="pq-btn-primary">
      <i class="ti ti-refresh" aria-hidden="true"></i> もう一度挑戦する
    </button>
  </div>
</div>

<script>
(function(){
  // 国土地理院ベースの軽量日本地図TopoJSON (GitHub raw)
  const TOPOJSON_URL = "https://raw.githubusercontent.com/dataofjapan/land/master/japan.topojson";
  const QUESTION_COUNT = 5;
  
  let allFeatures = [];
  let currentOrder = [];
  let qi = 0;
  let score = 0;
  let answered = false;

  const els = {
    loading: document.getElementById('pq-loading'),
    app: document.getElementById('pq-app'),
    end: document.getElementById('pq-end'),
    progress: document.getElementById('pq-progress'),
    score: document.getElementById('pq-score'),
    bar: document.getElementById('pq-bar'),
    svg: document.getElementById('pq-svg'),
    path: document.getElementById('pq-path'),
    options: document.getElementById('pq-options'),
    feedback: document.getElementById('pq-feedback'),
    nextBtn: document.getElementById('pq-next'),
    finalScore: document.getElementById('pq-final-score'),
    restartBtn: document.getElementById('pq-restart')
  };

  // Fisher-Yates シャッフル
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // プロパティから都道府県名を取得
  function getPrefName(feature) {
    const p = feature.properties;
    return p.nam_ja || p.name_ja || p.nam || p.name || p.NAME || "不明";
  }

  // 面積の小さな県でも綺麗に表示するための処理（小笠原諸島などの遠隔離島を除外し、描画領域を本土中心にする）
  function filterMainIslands(feature) {
    if (feature.geometry.type !== 'MultiPolygon') return feature;
    
    // 各島を独立したPolygonとして扱う
    const polygons = feature.geometry.coordinates.map(coords => ({
      type: 'Polygon',
      coordinates: coords
    }));
    
    // 最大面積の島（本土）を特定
    let maxArea = -1;
    let maxPolyIdx = -1;
    const areas = polygons.map(p => d3.geoArea({ type: 'Feature', geometry: p }));
    
    areas.forEach((a, i) => {
      if (a > maxArea) {
        maxArea = a;
        maxPolyIdx = i;
      }
    });
    
    const mainCenter = d3.geoCentroid({ type: 'Feature', geometry: polygons[maxPolyIdx] });
    
    // 本土から極端に離れた島（約500km以上）を描画対象から外す
    const filteredCoords = feature.geometry.coordinates.filter((coords, i) => {
      if (i === maxPolyIdx) return true;
      const center = d3.geoCentroid({ type: 'Feature', geometry: polygons[i] });
      const distSq = Math.pow(center[0] - mainCenter[0], 2) + Math.pow(center[1] - mainCenter[1], 2);
      return distSq < 25; // 距離しきい値
    });
    
    return {
      type: 'Feature',
      properties: feature.properties,
      geometry: { type: 'MultiPolygon', coordinates: filteredCoords }
    };
  }

  // データの非同期読み込み
  async function loadData() {
    try {
      const res = await fetch(TOPOJSON_URL);
      if (!res.ok) throw new Error("Network error");
      const topoData = await res.json();
      
      const features = topojson.feature(topoData, topoData.objects.japan).features;
      
      // 不正なデータを取り除きつつ、離れた島をフィルタリング
      allFeatures = features.map(f => {
        const processed = filterMainIslands(f);
        processed.prefName = getPrefName(f);
        return processed;
      }).filter(f => f.prefName !== "不明");

      startQuiz();
    } catch (err) {
      els.loading.innerHTML = '<div style="color:var(--danger);font-weight:700;"><i class="ti ti-alert-circle"></i> データの読み込みに失敗しました</div><p style="font-size:12px;margin-top:8px;">ネットワーク接続を確認してください。</p>';
      console.error(err);
    }
  }

  function startQuiz() {
    els.loading.style.display = 'none';
    els.end.style.display = 'none';
    els.app.style.display = 'block';
    
    currentOrder = shuffle(allFeatures).slice(0, QUESTION_COUNT);
    qi = 0;
    score = 0;
    renderQuestion();
  }

  // CSSアニメーションのリセット
  function restartSpin() {
    els.svg.classList.remove('pq-spin-anim');
    void els.svg.offsetWidth; // リフロー強制
    els.svg.classList.add('pq-spin-anim');
  }

  function renderQuestion() {
    answered = false;
    els.feedback.innerHTML = '';
    els.nextBtn.style.display = 'none';
    
    const targetFeature = currentOrder[qi];
    
    // 対象の都道府県の大きさに合わせて自動ズーム（余白5%）
    const projection = d3.geoMercator().fitExtent([[5, 5], [95, 95]], targetFeature);
    const pathGenerator = d3.geoPath().projection(projection);
    
    els.path.setAttribute('d', pathGenerator(targetFeature));
    restartSpin();
    
    // UIの進捗更新
    els.progress.innerHTML = `<i class="ti ti-flag" style="vertical-align:-2px;margin-right:4px;"></i>${qi + 1} / ${QUESTION_COUNT}`;
    els.score.innerHTML = `<i class="ti ti-check" style="vertical-align:-2px;margin-right:4px;"></i>正解 ${score}`;
    els.bar.style.width = Math.round((qi / QUESTION_COUNT) * 100) + '%';
    
    // 選択肢の生成（正解1つ ＋ ダミー3つ）
    const correctName = targetFeature.prefName;
    const pool = allFeatures.filter(f => f.prefName !== correctName);
    const wrongFeatures = shuffle(pool).slice(0, 3);
    const options = shuffle([targetFeature, ...wrongFeatures]);
    
    els.options.innerHTML = '';
    options.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'pq-opt';
      btn.textContent = f.prefName;
      btn.addEventListener('click', () => handleAnswer(f.prefName, correctName, btn));
      els.options.appendChild(btn);
    });
  }

  function handleAnswer(chosenName, correctName, btnEl) {
    if (answered) return;
    answered = true;
    
    const isCorrect = chosenName === correctName;
    if (isCorrect) score++;
    
    els.score.innerHTML = `<i class="ti ti-check" style="vertical-align:-2px;margin-right:4px;"></i>正解 ${score}`;
    
    // ボタンのスタイルを変更
    Array.from(els.options.children).forEach(b => {
      b.disabled = true;
      if (b.textContent === correctName) {
        b.classList.add('pq-correct');
      } else if (b === btnEl) {
        b.classList.add('pq-wrong');
      }
    });
    
    // メッセージと次へボタンを表示
    if (isCorrect) {
      els.feedback.innerHTML = `<div class="pq-feedback-text" style="color:var(--success);"><i class="ti ti-circle-check-filled" style="font-size:22px;"></i> 正解！</div>`;
    } else {
      els.feedback.innerHTML = `<div class="pq-feedback-text" style="color:var(--danger);"><i class="ti ti-circle-x-filled" style="font-size:22px;"></i> 不正解... 正解は「${correctName}」</div>`;
    }
    
    els.nextBtn.style.display = 'inline-flex';
  }

  function nextQuestion() {
    qi++;
    if (qi >= QUESTION_COUNT) {
      showEnd();
    } else {
      renderQuestion();
    }
  }

  function showEnd() {
    els.bar.style.width = '100%';
    els.app.style.display = 'none';
    els.end.style.display = 'block';
    els.finalScore.textContent = `${score} / ${QUESTION_COUNT} 問正解`;
  }

  // イベントリスナーの登録
  els.nextBtn.addEventListener('click', nextQuestion);
  els.restartBtn.addEventListener('click', startQuiz);

  // 初回データ読み込みの実行
  loadData();
})();
</script>
